<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- X Gradient (Cross-Platform) -->
    <linearGradient id="xGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="xGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Center Core Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Diagonal Bar 1 (Top-Left to Bottom-Right) -->
  <path d="M16 16 L48 48" stroke="url(#xGrad1)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />

  <!-- Diagonal Bar 2 (Top-Right to Bottom-Left) -->
  <path d="M48 16 L16 48" stroke="url(#xGrad2)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />

  <!-- Central Library Node / TPL Box -->
  <rect x="26" y="26" width="12" height="12" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
  <circle cx="32" cy="32" r="2.5" fill="#2563eb" />

  <!-- Subtle Android / Cross-Platform Corner Dots -->
  <circle cx="16" cy="16" r="2.5" fill="#38bdf8" />
  <circle cx="48" cy="16" r="2.5" fill="#34d399" />
  <circle cx="16" cy="48" r="2.5" fill="#34d399" />
  <circle cx="48" cy="48" r="2.5" fill="#38bdf8" />
</svg>
